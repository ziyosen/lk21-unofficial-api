<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zona Cinema — Nonton Film & Series Sub Indo</title>
<meta name="theme-color" content="#0b0b0f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0f; --bg2:#141419; --card:#1a1a21; --card2:#20202a;
  --bord:rgba(255,255,255,.08); --text:#f5f5f7; --mut:#9a9aa8;
  --acc:#f97316; --acc2:#ef4444; --gold:#fbbf24;
  --grad:linear-gradient(135deg,#f97316,#ef4444);
  --sh:0 18px 44px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
body.noscroll{overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2a2a35;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== NAVBAR ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:60;padding:14px 0;transition:background .35s,padding .35s,backdrop-filter .35s}
nav.solid{background:linear-gradient(180deg,rgba(11,11,15,.98),rgba(11,11,15,.92));backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.5);padding:9px 0}
.navin{max-width:1500px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:22px}
.logo{font-weight:900;font-size:23px;letter-spacing:-.8px;display:flex;align-items:center;gap:8px;flex-shrink:0;cursor:pointer}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.logo svg{width:24px;height:24px;color:var(--acc)}
.navlinks{display:flex;gap:20px;font-size:14px;color:#c9c9d3;font-weight:500}
.navlinks span{cursor:pointer;transition:color .2s;white-space:nowrap}
.navlinks span:hover{color:#fff}
.navlinks span.on{color:#fff;font-weight:700}
.spacer{flex:1}
.sbox{display:flex;align-items:center;background:rgba(255,255,255,.09);border:1px solid var(--bord);border-radius:9px;padding:8px 12px;gap:8px;transition:all .25s;width:220px}
.sbox:focus-within{background:rgba(255,255,255,.15);border-color:var(--acc)}
.sbox input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%;font-family:inherit}
.sbox input::placeholder{color:#8a8a97}
.sbox svg{width:16px;height:16px;color:#a8a8b5;flex-shrink:0}
.ava{width:34px;height:34px;border-radius:8px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;cursor:pointer}
@media(max-width:900px){.navlinks{display:none}.sbox{width:100%;max-width:200px}.navin{gap:12px;padding:0 14px}}

/* ===== ACCESSIBILITY (review Muse P1-4) ===== */
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px;border-radius:6px}
.mcard:focus-visible{transform:translateY(-7px)}
@media(hover:none){
  .nav-arrow{display:none}
  .row-h .more{opacity:1}
  .hovplay{opacity:0}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}

/* ===== HERO ===== */
.hero{position:relative;min-height:76vh;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:-90px}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;filter:blur(18px) brightness(.55) saturate(1.35);transform:scale(1.14)}
.hero-vig{position:absolute;inset:0;z-index:1;background:
  radial-gradient(120% 90% at 70% 10%,rgba(249,115,22,.10),transparent 55%),
  linear-gradient(90deg,rgba(11,11,15,.97) 0%,rgba(11,11,15,.85) 38%,rgba(11,11,15,.3) 68%,rgba(11,11,15,.8) 100%),
  linear-gradient(0deg,var(--bg) 2%,transparent 45%)}
.hero-in{position:relative;z-index:2;max-width:1500px;margin:0 auto;width:100%;padding:0 22px 150px;display:flex;align-items:flex-end;gap:34px}
.hero-poster{width:210px;flex-shrink:0;border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.hero-poster img{width:100%;display:block}
.hero-txt{max-width:640px}
.hero-tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:1.6px;color:var(--acc);margin-bottom:14px;text-transform:uppercase}
.hero-tag::before{content:'';width:20px;height:2.5px;background:var(--grad);border-radius:2px}
.hero-txt h1{font-size:clamp(30px,5.4vw,60px);font-weight:900;line-height:1.02;letter-spacing:-1.6px;margin-bottom:14px;text-shadow:0 3px 24px rgba(0,0,0,.7)}
.hero-meta{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:13.5px;color:#d0d0da;margin-bottom:12px;font-weight:600}
.hero-meta .dot{width:4px;height:4px;border-radius:50%;background:#6a6a78}
.pill{border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:1.5px 7px;font-size:11px;font-weight:800}
.pill.hd{border-color:#4ade80;color:#4ade80}
.hero-syn{font-size:14.5px;line-height:1.65;color:#b9b9c6;max-width:560px;margin-bottom:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero-dots{display:flex;gap:7px;margin-top:4px}
.hd{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);transition:all .25s;padding:0}
.hd.on{background:var(--acc);transform:scale(1.25)}
.hd:hover{background:rgba(255,255,255,.6)}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.btn-play{background:linear-gradient(135deg,#fff,#e6e6ee);color:#0b0b0f;font-weight:800;font-size:15.5px;padding:13px 30px;border-radius:9px;display:inline-flex;align-items:center;gap:9px;transition:transform .18s,box-shadow .18s}
.btn-play:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,255,255,.22)}
.btn-info{background:rgba(255,255,255,.16);backdrop-filter:blur(8px);color:#fff;font-weight:700;font-size:15.5px;padding:13px 28px;border-radius:9px;display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.15);transition:background .2s}
.btn-info:hover{background:rgba(255,255,255,.28)}
@media(max-width:760px){
  .hero{min-height:62vh}
  .hero-in{padding-bottom:130px;flex-direction:column;align-items:flex-start;gap:20px}
  .hero-poster{width:130px}
  .hero-syn{-webkit-line-clamp:2;font-size:13.5px}
  .btn-play,.btn-info{padding:11px 22px;font-size:14.5px}
}

/* ===== ROWS ===== */
.row{position:relative;z-index:3;margin-bottom:36px}
.row-h{display:flex;align-items:center;gap:10px;padding:0 22px;margin-bottom:13px;max-width:1500px;margin-left:auto;margin-right:auto}
.row-h h2{font-size:19px;font-weight:800;letter-spacing:-.4px}
.row-h .more{margin-left:auto;font-size:12.5px;color:var(--mut);font-weight:700;cursor:pointer;opacity:0;transition:opacity .2s}
.row:hover .row-h .more{opacity:1}
.row-h .more:hover{color:var(--acc)}
.scroll{display:flex;gap:13px;overflow-x:auto;padding:6px 22px 14px;scroll-behavior:smooth;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.wrap-scroll{max-width:1500px;margin:0 auto;position:relative}
.nav-arrow{position:absolute;top:50%;transform:translateY(-60%);width:42px;height:78px;background:rgba(11,11,15,.82);backdrop-filter:blur(6px);border-radius:9px;display:none;place-items:center;z-index:6;cursor:pointer;opacity:0;transition:opacity .2s}
.wrap-scroll:hover .nav-arrow{opacity:1}
.nav-arrow.l{left:6px}.nav-arrow.r{right:6px}
.nav-arrow svg{width:20px;height:20px}
@media(min-width:1000px){.nav-arrow{display:grid}}

/* ===== CARD ===== */
.mcard{width:172px;flex-shrink:0;cursor:pointer;position:relative;transition:transform .22s}
.mcard:hover{transform:translateY(-7px)}
.mcard .pw{position:relative;aspect-ratio:2/3;border-radius:11px;overflow:hidden;background:var(--card2);box-shadow:0 8px 22px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06)}
.mcard .pw img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.mcard:hover .pw img{transform:scale(1.07)}
.mcard .pw::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.82),transparent 55%);opacity:0;transition:opacity .25s}
.mcard:hover .pw::after{opacity:1}
.bdg{position:absolute;z-index:3;border-radius:6px;font-size:10.5px;font-weight:800;padding:2.5px 7px;backdrop-filter:blur(5px)}
.bdg.r{top:8px;left:8px;background:rgba(0,0,0,.75);color:var(--gold)}
.bdg.q{top:8px;right:8px;background:rgba(0,0,0,.75);color:#4ade80;font-size:9.5px;letter-spacing:.5px}
.bdg.n{top:6px;left:8px;background:none;font-size:56px;font-weight:900;color:rgba(255,255,255,.3);-webkit-text-stroke:2.5px rgba(255,255,255,.6);line-height:1;padding:0;backdrop-filter:none}
.mcard .htxt{margin-top:8px;padding:0 2px}
.mcard .htxt h3{font-size:12.8px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}
.mcard .htxt p{font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hovplay{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:opacity .25s;z-index:4}
.mcard:hover .hovplay{opacity:1}
.hovplay .pb{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.hovplay .pb svg{width:17px;height:17px;color:#0b0b0f;margin-left:2px}
@media(max-width:620px){.mcard{width:128px}.mcard .htxt h3{font-size:11.5px;min-height:30px}}

/* playbar hover (desktop) */
.hbar{position:absolute;bottom:0;left:0;right:0;z-index:5;display:flex;gap:6px;padding:8px;opacity:0;transform:translateY(6px);transition:all .25s}
.mcard:hover .hbar{opacity:1;transform:none}
.hbar b{width:31px;height:31px;border-radius:50%;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;backdrop-filter:blur(5px)}
.hbar b:first-child{background:#fff;border-color:#fff}
.hbar b svg{width:13px;height:13px;color:#fff}
.hbar b:first-child svg{color:#0b0b0f;margin-left:1.5px}

/* ===== GRID VIEW ===== */
.pagehead{max-width:1500px;margin:0 auto;padding:112px 22px 22px}
.pagehead h1{font-size:29px;font-weight:900;letter-spacing:-1px;margin-bottom:6px}
.pagehead p{color:var(--mut);font-size:13.5px}
.grid{max-width:1500px;margin:0 auto;padding:0 22px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:19px}
.grid .mcard{width:100%}
@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr);padding:0 14px 24px;gap:14px}.grid .mcard .htxt{display:none}}
.pager{display:flex;gap:11px;justify-content:center;align-items:center;padding:18px 0 60px}
.pager button{background:var(--card);border:1px solid var(--bord);color:#fff;border-radius:9px;padding:10px 22px;font-weight:700;font-size:13.5px;transition:all .2s}
.pager button:hover:not(:disabled){background:var(--card2);border-color:var(--acc)}
.pager button:disabled{opacity:.3;cursor:default}
.pager span{color:var(--mut);font-size:13px;font-weight:700}
.chips{max-width:1500px;margin:0 auto;padding:0 22px 26px;display:flex;flex-wrap:wrap;gap:9px}
.chip{background:var(--card);border:1px solid var(--bord);border-radius:999px;padding:9px 17px;font-size:13px;font-weight:700;color:#d5d5de;transition:all .18s}
.chip:hover{border-color:var(--acc);color:#fff;transform:translateY(-2px);background:var(--card2)}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}

/* ===== MODAL ===== */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(9px);z-index:100;display:none;overflow-y:auto;padding:26px 14px 60px}
#modal.on{display:block}
.sheet{max-width:920px;margin:0 auto;background:var(--bg2);border:1px solid var(--bord);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.75);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.mhero{position:relative;height:300px;overflow:hidden}
.mhero img{width:100%;height:100%;object-fit:cover;filter:brightness(.55) blur(3px) saturate(1.3);transform:scale(1.1)}
.mhero .mv{position:absolute;inset:0;background:linear-gradient(0deg,var(--bg2) 3%,rgba(20,20,25,.55) 55%,rgba(20,20,25,.3))}
.mbody{position:relative;margin-top:-96px;padding:0 26px 26px;display:flex;gap:22px;flex-wrap:wrap}
.mposter{width:158px;flex-shrink:0;border-radius:12px;overflow:hidden;box-shadow:var(--sh);border:1px solid rgba(255,255,255,.09)}
.mposter img{width:100%;display:block}
.minfo{flex:1;min-width:250px;padding-top:98px}
.minfo h2{font-size:25px;font-weight:900;letter-spacing:-.7px;margin-bottom:9px;line-height:1.15}
.mmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:#c5c5d0;margin-bottom:11px;font-weight:600}
.tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tag{background:rgba(255,255,255,.09);border:1px solid var(--bord);border-radius:6px;padding:3.5px 10px;font-size:11.5px;font-weight:700;color:#d8d8e2}
.msyn{font-size:14px;line-height:1.7;color:#c0c0cd;margin-bottom:17px}
.mact{display:flex;gap:11px;flex-wrap:wrap;margin-bottom:16px}
#vid{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;display:block;box-shadow:var(--sh)}
.vstatus{font-size:13px;color:var(--mut);margin-top:10px;font-weight:600}
.mclose{position:sticky;top:0;float:right;margin:14px 14px 0 0;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--bord);display:grid;place-items:center;z-index:20;font-size:16px;backdrop-filter:blur(6px)}
.mclose:hover{background:var(--acc2)}
.eps{margin-top:18px;border-top:1px solid var(--bord);padding-top:16px}
.eps h3{font-size:14px;font-weight:800;margin-bottom:11px;color:#e5e5ec}
.eplist{display:flex;flex-direction:column;gap:7px;max-height:290px;overflow-y:auto}
.epitem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--bord);border-radius:9px;padding:10px 13px;text-align:left;transition:all .18s;width:100%}
.epitem:hover{background:var(--card2);border-color:var(--acc);transform:translateX(4px)}
.epitem b{background:rgba(255,255,255,.1);width:27px;height:27px;border-radius:7px;display:grid;place-items:center;font-size:11.5px;flex-shrink:0}
.epitem span{font-size:12.7px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5d5de;font-weight:600}

/* ===== LOADING / EMPTY ===== */
.spin{margin:80px auto;width:38px;height:38px;border:3px solid rgba(255,255,255,.13);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:80px 22px;font-size:14.5px;max-width:1500px;margin:0 auto}
.sk{background:linear-gradient(100deg,#1a1a21 30%,#25252f 50%,#1a1a21 70%);background-size:200% 100%;animation:shm 1.4s infinite;border-radius:11px}
@keyframes shm{to{background-position:-200% 0}}
.skcard{width:172px;flex-shrink:0}
.skcard .pw{aspect-ratio:2/3;border-radius:11px}
@media(max-width:620px){.skcard{width:128px}}
footer{max-width:1500px;margin:0 auto;padding:34px 22px 110px;color:#6a6a78;font-size:12.5px;text-align:center;border-top:1px solid rgba(255,255,255,.05)}
footer b{color:var(--acc);font-weight:800}
.footlogo{display:flex;align-items:center;justify-content:center;gap:7px;font-size:17px;font-weight:900;letter-spacing:-.5px;color:var(--text);margin-bottom:7px}
.footlogo svg{width:19px;height:19px;color:var(--acc)}
.footlogo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.footcred{color:#8a8a97}
.footcred b{color:#c9c9d3}

/* ===== BOTTOM NAVIGATION (arahan bos: Home, Movies, Negara, Genre) ===== */
.bottomnav{position:fixed;top:auto;left:0;right:0;bottom:0;height:auto;z-index:90;background:rgba(13,13,18,.94);backdrop-filter:blur(16px);border-top:1px solid var(--bord);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.bnav{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:11px;color:var(--mut);font-size:11px;font-weight:700;line-height:1;transition:color .2s,background .2s}
.bnav svg{width:23px;height:23px}
.bnav:hover{color:#fff}
.bnav.on{color:#fff;background:rgba(255,255,255,.06)}
.bnav.on svg{color:var(--acc)}
.bnav:active{transform:scale(.97)}

/* ===== ROW "SEMUA" BUTTON (kayak foto: selalu kelihatan, bisa dipencet) ===== */
.row-h .more{opacity:1;background:var(--grad);color:#fff;border-radius:7px;padding:6px 13px;font-size:11.5px;letter-spacing:.4px;box-shadow:0 6px 18px rgba(239,68,68,.28)}
.row-h .more:hover{color:#fff;filter:brightness(1.08)}
@media(hover:none){.row-h .more{opacity:1}}

/* ===== PLAY / DETAIL VIEW (kayak foto kedua) ===== */
.playerbox{background:#000;border-bottom:1px solid var(--bord)}
.playerstage{position:relative;aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden}
.playerstage>img.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.playerstage video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.bigplay{position:relative;z-index:3;width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 14px 36px rgba(0,0,0,.65);transition:transform .18s}
.bigplay:hover{transform:scale(1.06)}
.bigplay svg{width:30px;height:30px;color:#0b0b0f;margin-left:3px}
.playertools{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:11px 16px;background:#050507}
.playertools button{display:inline-flex;align-items:center;gap:7px;color:#e6e6ee;font-size:13px;font-weight:700}
.playertools button:hover{color:var(--acc)}
.playertools svg{width:16px;height:16px}
.playerswitch{margin-left:auto;background:rgba(255,255,255,.08);border:1px solid var(--bord);border-radius:8px;padding:8px 12px}
.playerbar{display:flex;align-items:center;gap:9px;width:100%;background:#17171f;border-top:1px solid var(--bord);padding:12px 16px;color:#f5f5f7;font-size:13px;font-weight:800;letter-spacing:.6px;text-align:left}
.playerbar svg{width:16px;height:16px;flex-shrink:0}
.playerbar .chev{margin-left:auto;color:var(--mut)}
.playerbar:hover{background:#1d1d27}
.actrow .btn-act{flex:1;justify-content:center}
.detailbody{padding:20px 22px 26px}
.detailbody h2{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-bottom:8px;line-height:1.15}
.dmeta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:#d5d5de;font-weight:600;margin-bottom:12px}
.dmeta .sep{color:#5c5c69}
.tagbtn{background:rgba(249,115,22,.13);border:1px solid rgba(249,115,22,.35);color:#ffb38a;border-radius:6px;padding:4px 11px;font-size:12px;font-weight:700}
.tagbtn:hover{background:rgba(249,115,22,.25);color:#fff}
.actrow{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px}
.btn-dl{background:var(--grad);color:#fff;font-weight:800;font-size:14px;padding:12px 20px;border-radius:9px;display:inline-flex;gap:8px;align-items:center}
.btn-act{background:#2b3440;color:#fff;font-weight:700;font-size:14px;padding:12px 20px;border-radius:9px;display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.1)}
.btn-act.saved{background:#14532d;border-color:#22c55e}
.ratingbox{border-top:1px solid var(--bord);padding-top:18px;margin-top:4px}
.ratingtop{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.bigrating{font-size:56px;font-weight:900;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stars{display:flex;gap:2px;color:#3d3d4a;line-height:1.2}
.stars svg{width:19px;height:19px}
.stars .on{color:var(--acc2)}
.rateuser{margin-top:14px}
.rateuser p{font-size:13.5px;color:#d5d5de;font-weight:600;margin-bottom:8px}
.ratebtns{display:flex;gap:3px;flex-wrap:wrap}
.ratebtns button{color:#3d3d4a;padding:2px;line-height:1}
.ratebtns button svg{width:25px;height:25px;display:block}
.ratebtns button.on{color:var(--gold)}
.btn-dl svg,.btn-act svg{width:17px;height:17px;flex-shrink:0}
.bdg.r{display:inline-flex;align-items:center;gap:4px}
.bdg.r svg{width:11px;height:11px}
.inline-ico{display:inline-flex;align-items:center;gap:6px}
.inline-ico svg{width:15px;height:15px;flex-shrink:0}
.hero-meta .rating-ico{display:inline-flex;align-items:center;gap:5px}
.hero-meta .rating-ico svg{width:14px;height:14px}
.mclose svg{width:17px;height:17px}
.toast{position:sticky;bottom:86px;z-index:5;display:none;background:#1d2b1d;border:1px solid #22c55e;color:#bbf7d0;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:700;margin-top:12px}
.toast.show{display:block}
</style>
</head>
<body>

<header id="nav"><nav aria-label="Navigasi utama">
  <div class="navin">
    <div class="logo" onclick="go('home')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 2v2h2V5H7zm8 0v2h2V5h-2zM7 19v2h2v-2H7zm8 0v2h2v-2h-2zM10 9.5v5l4.5-2.5L10 9.5z"/></svg>
      Zona<b>Cinema</b>
    </div>
    <div class="navlinks" id="navlinks"></div>
    <div class="spacer"></div>
    <div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" role="img" aria-label="Cari"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Cari film / series..." autocomplete="off" aria-label="Kolom pencarian">
    </div>
    <div class="ava">CZ</div>
  </div>
</nav></header>

<main id="view"></main>
<footer>
  <div class="footlogo"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 2v2h2V5H7zm8 0v2h2V5h-2zM7 19v2h2v-2H7zm8 0v2h2v-2h-2zM10 9.5v5l4.5-2.5L10 9.5z"/></svg><span>Zona<b>Cinema</b></span></div>
  <div class="footcred">By: <b>ZeinthHub Project</b> · Powered by <b>@Bleszh</b></div>
</footer>

<!-- Navigasi bawah — sesuai arahan bos: 1 Home (rumah), 2 Movies, 3 Negara (bumi), 4 Genre -->
<nav class="bottomnav" aria-label="Navigasi bawah">
  <button class="bnav on" data-bnav="home" onclick="bottomGo('home')" aria-label="Home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    <span>Home</span>
  </button>
  <button class="bnav" data-bnav="movies" onclick="bottomGo('movies')" aria-label="Movies">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v5M16 4v5M10.5 12.5v4l4-2z" fill="currentColor" stroke="none"/></svg>
    <span>Movies</span>
  </button>
  <button class="bnav" data-bnav="country" onclick="bottomGo('country')" aria-label="Negara">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3z"/></svg>
    <span>Negara</span>
  </button>
  <button class="bnav" data-bnav="genre" onclick="bottomGo('genre')" aria-label="Genre">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h10M4 19h7"/><circle cx="19" cy="16.5" r="2.5"/></svg>
    <span>Genre</span>
  </button>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
/* ================= CONFIG ================= */
const API = window.CINE_API || (location.origin.includes('vercel') ? location.origin : 'http://localhost:8000');
const NAV = [
  {id:'home',    label:'Beranda'},
  {id:'series',  label:'Series'},
  {id:'genre',   label:'Genre'},
  {id:'country', label:'Negara'},
  {id:'year',    label:'Tahun'},
];
const PLACE='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="180" height="270" viewBox="0 0 180 270"><rect width="100%" height="100%" fill="#20202a"/><g fill="none" stroke="#555562" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(52 91) scale(3.2)"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4M16 5v4M10.5 12l4 2.5-4 2.5z" fill="#555562" stroke="none"/></g><text x="50%" y="66%" fill="#555562" text-anchor="middle" font-size="15" font-family="sans-serif">No Poster</text></svg>');
let curState={kind:'home'};

/* ================= HELPERS ================= */
function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function img(m){return esc(m.images||m.image||PLACE)}
function yr(m){return m.year&&m.year!=='N/A'?esc(m.year):''}
function rt(m){return m.rating&&m.rating!=='N/A'&&m.rating!=='0'?esc(m.rating):''}
async function jget(u){const r=await fetch(API+u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
function skel(n){return Array.from({length:n}).map(()=>`<div class="skcard"><div class="pw sk"></div><div class="sk" style="height:12px;margin-top:8px;width:80%"></div></div>`).join('')}
const ICO = {
  star:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11m0 0 4.2-4.2M12 14 7.8 9.8"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="17.5" cy="5.5" r="2.5"/><circle cx="17.5" cy="18.5" r="2.5"/><path d="m8.2 10.8 7-4M8.2 13.2l7 4"/></svg>',
  bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 12.5 5 5 10-11"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5 5 19"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.8 20c.7-3.2 3-5 6.2-5s5.5 1.8 6.2 5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.9M17.8 15.4c2 .5 3.3 2 3.8 4.6"/></svg>',
  clapper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3.5 4.5 20 3l.6 4L4 8.5z"/><path d="m8 4 2 4M13 3.6l2 4M18 3.2l2 4"/></svg>',
  monitorPlay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8.5v4l4-2z" fill="currentColor" stroke="none"/><path d="M9 21h6M12 17v4"/></svg>'
};

/* ================= CARD ================= */
function card(m,rank){
  return `<div class="mcard" role="button" tabindex="0" aria-label="Buka detail ${esc(m.title)}" onclick="openDetail('${esc(m.slug)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetail('${esc(m.slug)}')}">
    <div class="pw">
      ${rank?`<span class="bdg n">${rank}</span>`:''}
      <img loading="lazy" decoding="async" alt="${esc(m.title)}" src="${img(m)}" onerror="this.onerror=null;this.src='${PLACE}'">
      ${rt(m)?`<span class="bdg r">${ICO.star}${rt(m)}</span>`:''}
      ${m.quality&&m.quality!=='N/A'?`<span class="bdg q">${esc(m.quality)}</span>`:''}
      <div class="hovplay"><div class="pb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div></div>
    </div>
    <div class="htxt"><h3>${esc(m.title)}</h3><p>${[yr(m),m.genre].filter(Boolean).join(' · ')}</p></div>
  </div>`;
}

/* ================= HOME ================= */
/* Baris di Home — sesuai arahan bos. base = endpoint tanpa ?page, SEMUA membuka grid penuh endpoint itu.
   Catatan teknis buat Hermes: API belum punya endpoint khusus "series unggulan/update", jadi
   UNGGULAN dipetakan ke katalog series drama dan UPDATE ke series tahun berjalan (2026). */
const ROWS = [
  {title:'Film Terbaru',    base:'/movies/latest'},
  {title:'Maraton Drakor',  base:'/series/country/south-korea'},
  {title:'SERIES UNGGULAN', base:'/series/genre/drama', rank:true},
  {title:'SERIES UPDATE',   base:'/series/year/2026'},
  {title:'Romance Terbaru', base:'/movies/genre/romance'},
  {title:'Horror Terbaru',  base:'/movies/genre/horror'},
];
let heroList=[], heroI=0;

async function viewHome(){
  setNav('home');
  const v=document.getElementById('view');
  v.innerHTML=`<div class="hero"><div class="hero-bg"></div><div class="hero-vig"></div><div class="hero-in"><div class="spin"></div></div></div>`;
  try{
    const d=await jget(ROWS[0].base+'?page=1');
    heroList=(d.results||[]).slice(0,5);
    renderHero(); buildRows();
  }catch(e){
    v.innerHTML=`<div class="pagehead"><h1>Ups, ada kendala</h1><p>Gagal memuat: ${esc(e.message)} — coba refresh.</p></div>`;
  }
}
function renderHero(){
  const v=document.getElementById('view');
  const m=heroList[heroI%heroList.length]||{};
  v.innerHTML=`
  <div class="hero">
    <div class="hero-bg"><img src="${img(m)}" alt="" onerror="this.onerror=null;this.src='${PLACE}'"></div>
    <div class="hero-vig"></div>
    <div class="hero-in">
      <div class="hero-poster"><img src="${img(m)}" onerror="this.onerror=null;this.src='${PLACE}'"></div>
      <div class="hero-txt">
        <div class="hero-tag">Zona Cinema Original · Trending</div>
        <h1>${esc(m.title)||'Memuat...'}</h1>
        <div class="hero-meta">
          ${rt(m)?`<span class="rating-ico" style="color:var(--gold)">${ICO.star}${rt(m)}</span>`:''}
          ${yr(m)?`<span>${yr(m)}</span>`:''}
          ${m.quality?`<span class="pill hd">${esc(m.quality)}</span>`:''}
          ${m.duration?`<span>${esc(m.duration)}</span>`:''}
          <span class="dot"></span><span>${esc(m.genre||'Film')}</span>
        </div>
        <div class="hero-syn">${esc(m.synopsis||'Klik putar untuk mulai menonton. Ribuan film & series siap ditonton langsung di Zona Cinema.')}</div>
        <div class="hero-btns">
          <button class="btn-play" onclick="openDetail('${esc(m.slug)}')"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Putar</button>
          <button class="btn-info" onclick="openDetail('${esc(m.slug)}')">ⓘ Info Selengkapnya</button>
        </div>
        <div class="hero-dots" id="heroDots">${heroList.map((_,i)=>`<button class="hd${i===heroI%heroList.length?' on':''}" aria-label="Sorotan ${i+1}" onclick="setHero(${i})"></button>`).join('')}</div>
      </div>
    </div>
  </div>
  <div id="rows"></div>`;
}
function buildRows(){
  const c=document.getElementById('rows');
  if(!c) return;
  c.innerHTML=ROWS.map((r,i)=>`
    <div class="row">
      <div class="row-h"><h2>${r.title}</h2><button class="more" onclick="goCat('${r.base}','${esc(r.title)}',1)" aria-label="Lihat semua ${esc(r.title)}">SEMUA</button></div>
      <div class="wrap-scroll">
        <div class="nav-arrow l" aria-label="Geser kiri" onclick="scrollRow(${i},-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></div>
        <div class="scroll" id="row-${i}">${skel(7)}</div>
        <div class="nav-arrow r" aria-label="Geser kanan" onclick="scrollRow(${i},1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg></div>
      </div>
    </div>`).join('');
  ROWS.forEach(async (r,i)=>{
    try{
      const d=await jget(r.base+'?page=1');
      const el=document.getElementById('row-'+i);
      if(el) el.innerHTML=(d.results||[]).map((m,j)=>card(m,r.rank?j+1:0)).join('');
    }catch(e){
      const el=document.getElementById('row-'+i);
      if(el) el.innerHTML=`<div style="color:#6a6a78;font-size:13px;padding:20px 4px">Gagal memuat (${esc(e.message)})</div>`;
    }
  });
}
function scrollRow(i,dir){const el=document.getElementById('row-'+i);if(el)el.scrollBy({left:dir*(el.clientWidth*0.8),behavior:'smooth'})}

/* ================= CATEGORY GRID ================= */
async function goCat(url,title,page){
  curState={kind:'cat',url,title,page:page||1};
  setNav(null);
  const v=document.getElementById('view');
  window.scrollTo({top:0});
  v.innerHTML=`<div class="pagehead"><h1>${esc(title)}</h1><p>Memuat...</p></div><div class="grid">${Array.from({length:12}).map(()=>'<div class="sk" style="aspect-ratio:2/3"></div>').join('')}</div>`;
  try{
    const d=await jget(url+`${url.includes('?')?'&':'?'}page=${curState.page}`);
    const r=d.results||[]; const tp=d.total_pages||1;
    v.innerHTML=`<div class="pagehead"><h1>${esc(title)}</h1><p>${tp>1?`Halaman ${curState.page} dari ${tp}`:'Katalog'}</p></div>
      <div class="grid">${r.length?r.map(m=>card(m)).join(''):'<div class="empty">Belum ada data</div>'}</div>
      ${tp>1?`<div class="pager"><button ${curState.page<=1?'disabled':''} onclick="goCatPage(-1)">‹ Sebelumnya</button><span>${curState.page} / ${tp}</span><button ${curState.page>=tp?'disabled':''} onclick="goCatPage(1)">Berikutnya ›</button></div>`:''}`;
  }catch(e){
    v.innerHTML=`<div class="pagehead"><h1>${esc(title)}</h1><p>Gagal: ${esc(e.message)}</p></div>`;
  }
}

function goCatPage(delta){
  if(curState.kind!=='cat') return;
  goCat(curState.url, curState.title, Math.max(1,(curState.page||1)+delta));
}

/* ================= BOTTOM NAVIGATION ================= */
function setBottom(id){
  document.querySelectorAll('.bnav').forEach(b=>b.classList.toggle('on', b.dataset.bnav===id));
}
function bottomGo(kind){
  closeDetail();
  if(kind==='home'){ setBottom('home'); return go('home'); }
  if(kind==='movies'){ setBottom('movies'); return goCat('/movies/latest','Movies',1); }
  if(kind==='country'){ setBottom('country'); return go('country'); }
  if(kind==='genre'){ setBottom('genre'); return go('genre'); }
}

/* ================= PANEL (genre/negara/tahun/series) ================= */
async function go(kind){
  curState={kind};
  const v=document.getElementById('view');
  window.scrollTo({top:0});
  if(kind==='home') return viewHome();
  const cfg={
    series:  {api:'/movies/genres',    head:'Series', sub:'Pilih genre series', mk:x=>'/series/genre/'+x},
    genre:   {api:'/movies/genres',    head:'Genre',  sub:'Pilih genre film',   mk:x=>'/movies/genre/'+x},
    country: {api:'/movies/countries', head:'Negara', sub:'Pilih negara asal',  mk:x=>'/movies/country/'+x},
    year:    {api:'/movies/years',     head:'Tahun',  sub:'Pilih tahun rilis',  mk:x=>'/movies/year/'+x},
  }[kind];
  setNav(kind);
  v.innerHTML=`<div class="pagehead"><h1>${cfg.head}</h1><p>Memuat...</p></div><div class="chips"><div class="spin" style="margin:20px"></div></div>`;
  try{
    const d=await jget(cfg.api);
    const seen=new Set(); const items=(d.results||[]).filter(x=>!seen.has(x.href)&&seen.add(x.href));
    v.innerHTML=`<div class="pagehead"><h1>${cfg.head}</h1><p>${cfg.sub} · ${items.length} pilihan</p></div>
      <div class="chips">${items.map(x=>`<button class="chip" onclick="goCat('${cfg.mk(x.href)}','${esc(cfg.head+' — '+x.name).replace(/'/g,"\\'")}')">${esc(x.name)}</button>`).join('')}</div>`;
  }catch(e){v.innerHTML=`<div class="pagehead"><h1>${cfg.head}</h1><p>Gagal: ${esc(e.message)}</p></div>`}
}
function setNav(id){
  document.querySelectorAll('#navlinks span').forEach(s=>s.classList.toggle('on',s.dataset.n===id));
  if(id==='home'||id==='genre'||id==='country') setBottom(id);
}

/* ================= SEARCH ================= */
let sT;
document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(sT);
  sT=setTimeout(()=>{
    const v=e.target.value.trim();
    if(!v){if(curState.kind==='search')go('home');return}
    curState={kind:'search'}; setNav(null);
    const el=document.getElementById('view');
    el.innerHTML=`<div class="pagehead" style="padding-top:112px"><h1>Hasil: "${esc(v)}"</h1><p>Mencari...</p></div><div class="grid">${Array.from({length:8}).map(()=>'<div class="sk" style="aspect-ratio:2/3"></div>').join('')}</div>`;
    jget(`/search?s=${encodeURIComponent(v)}&page=1`).then(d=>{
      const r=d.results||[];
      el.innerHTML=`<div class="pagehead"><h1>Hasil: "${esc(v)}"</h1><p>${r.length} judul ditemukan</p></div>
        <div class="grid">${r.length?r.map(m=>card(m)).join(''):''}</div>${r.length?'':'<div class="empty">Tidak ada hasil</div>'}`;
    }).catch(err=>{el.innerHTML=`<div class="pagehead"><h1>Hasil: "${esc(v)}"</h1><p>Gagal: ${esc(err.message)}</p></div>`});
  },520);
});

/* ================= DETAIL MODAL + PLAYER ================= */
function stopVideo(){
  if(hlsInst){try{hlsInst.destroy()}catch(e){}hlsInst=null}
  const v=document.getElementById('vid');
  if(v){try{v.pause()}catch(e){}v.removeAttribute('src');v.load()}
}
let hlsInst=null;
async function openDetail(slug){
  const mo=document.getElementById('modal'), sh=document.getElementById('sheet');
  mo.classList.add('on');document.body.classList.add('noscroll');
  sh.innerHTML='<div class="spin"></div>';
  try{
    let m={}, eps=[], isSeries=false;
    try{ const j=await jget(`/movies/${slug}/stream`); m=j.result||{}; }catch(e){}
    try{
      const js=await jget(`/series/${slug}/`); const r=js.result||{};
      if(r.episodes&&r.episodes.length){
        isSeries=true; eps=r.episodes;
        if(!m.image)m.image=r.image;
        if(!m.title||m.title===slug)m.title=r.title;
        m.genres=m.genres||r.genres; m.stars=m.stars&&m.stars.length?m.stars:r.stars;
        m.country=m.country||r.country;
        if(!m.synopsis||m.synopsis.length<40)m.synopsis=r.synopsis;
      }
    }catch(e){}
    const playSlug = isSeries&&eps.length ? eps[0].href.split('/').join('') : slug;
    const displayTitle = String(m.title||slug).replace(/\s*\(\d{4}\)\s*$/,'');
    window.__curDetail = {slug, playSlug, title:displayTitle, year:m.year||''};
    const ratingNum = parseFloat(m.rating)||0;
    const starsFull = Math.round(ratingNum);
    const userRate = parseInt(localStorage.getItem('cz-rate-'+slug)||'0');
    const isSaved = (JSON.parse(localStorage.getItem('cz-saved')||'[]')).some(x=>x.slug===slug);
    sh.innerHTML=`
    <button class="mclose" onclick="closeDetail()" aria-label="Tutup detail">${ICO.close}</button>
    <div class="playerbox" id="playerbox">
      <div class="playerstage" id="playerstage">
        <img class="poster" id="playerPoster" src="${img(m)}" onerror="this.onerror=null;this.src='${PLACE}'" alt="${esc(m.title)}">
        <button class="bigplay" id="bigplay" onclick="playMovie('${esc(playSlug)}')" aria-label="Putar ${esc(m.title)}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <video id="vid" controls playsinline style="display:none"></video>
      </div>
      <div class="playertools">
        <button onclick="goFullscreen()" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg> Fullscreen</button>
        <button onclick="reportCurrent()" aria-label="Laporkan masalah"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h13l-2.5 4L18 12H5" fill="currentColor" stroke="none"/></svg> Reports</button>
        <button onclick="openTrailer()" aria-label="Trailer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg> Trailer</button>
      </div>
      <button class="playerbar" onclick="playMovie('${esc(playSlug)}')" aria-label="Ganti player / muat ulang player">${ICO.monitorPlay}<span>GANTI PLAYER P2P</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="vstatus" id="vstatus" style="padding:0 16px 12px;background:#050507"></div>
    </div>
    <div class="detailbody">
        <h2>${esc(displayTitle)} ${yr(m)?`<span style="color:var(--mut);font-weight:500;font-size:17px">(${yr(m)})</span>`:''}</h2>
        <div class="dmeta">
          ${m.quality&&m.quality!=='N/A'?`<span>${esc(m.quality)}</span><span class="sep">|</span>`:''}
          ${m.duration&&m.duration!=='N/A'?`<span>${esc(m.duration)}</span><span class="sep">|</span>`:''}
          ${m.release&&m.release!=='N/A'?`<span>${esc(m.release)}</span>`:''}
        </div>
        <div class="tags">
          ${m.country&&m.country!=='N/A'?`<button class="tagbtn" onclick="tagGoCountry('${esc(String(m.country).replace(/'/g,"\\'"))}')">${esc(m.country)}</button>`:''}
          ${(Array.isArray(m.genres)?m.genres:String(m.genres||'').split(',')).filter(g=>g&&g.trim()&&g.trim()!=='N/A').map(g=>`<button class="tagbtn" onclick="closeDetail();goCat('/movies/genre/${encodeURIComponent(g.trim().toLowerCase().replace(/ /g,'-'))}','Genre — ${esc(g.trim())}',1)">${esc(g.trim())}</button>`).join('')}
        </div>
        <div class="actrow">
          <button class="btn-act" onclick="shareCurrent()">${ICO.share}<span>Share</span></button>
          <button class="btn-act ${isSaved?'saved':''}" id="saveBtn" onclick="toggleSaveCurrent()">${isSaved?ICO.check+ '<span>Tersimpan</span>':ICO.bookmark+'<span>Save</span>'}</button>
        </div>
        <div class="ratingbox">
          <div class="ratingtop">
            <div class="bigrating">${ratingNum?ratingNum.toFixed(1):'-'}</div>
            <div>
              <div class="stars" aria-label="Rating ${ratingNum} dari 10">${Array.from({length:10}).map((_,i)=>`<span class="${i<starsFull?'on':''}">${ICO.star}</span>`).join('')}</div>
              <div style="color:var(--mut);font-size:12.5px;font-weight:600;margin-top:4px">Rating judul ini</div>
            </div>
          </div>
          <div class="rateuser">
            <p>Beri rating film ini:</p>
            <div class="ratebtns" id="ratebtns">${Array.from({length:10}).map((_,i)=>`<button class="${i<userRate?'on':''}" onclick="rateCurrent(${i+1})" aria-label="Beri rating ${i+1}">${ICO.star}</button>`).join('')}</div>
            ${userRate?`<p style="margin-top:6px;color:var(--gold)">Rating kamu: ${userRate}/10 — tersimpan di perangkat ini</p>`:''}
          </div>
        </div>
        <div class="msyn" style="margin-top:18px">${esc(m.synopsis||'')}</div>
        ${m.stars&&m.stars.length?`<div class="mmeta" style="margin-bottom:6px"><span class="inline-ico">${ICO.users}${m.stars.map(esc).join(', ')}</span></div>`:''}
        ${m.directors&&m.directors.length?`<div class="mmeta"><span class="inline-ico">${ICO.clapper}${m.directors.map(esc).join(', ')}</span></div>`:''}
        <div class="toast" id="detailToast"></div>
    </div>
    ${eps.length?`<div style="padding:0 26px 26px"><div class="eps"><h3 class="inline-ico">${ICO.monitorPlay}Daftar Episode (${eps.length})</h3><div class="eplist">${eps.map((e,i)=>`<button class="epitem" onclick="playMovie('${esc(e.href.split('/').join(''))}')"><b>${i+1}</b><span>${esc(e.label)}</span></button>`).join('')}</div></div></div>`:''}`;
  }catch(e){
    sh.innerHTML=`<button class="mclose" onclick="closeDetail()" aria-label="Tutup detail">${ICO.close}</button><div class="empty">Gagal memuat detail: ${esc(e.message)}</div>`;
  }
}
async function playMovie(slug){
  const box=document.getElementById('playerbox'), st=document.getElementById('vstatus'), v=document.getElementById('vid');
  const bp=document.getElementById('bigplay'), pp=document.getElementById('playerPoster');
  if(!box||!v) return;
  stopVideo();
  v.style.display='block';
  if(bp) bp.style.display='none';
  if(pp) pp.style.display='none';
  if(st) st.textContent='Menyiapkan sumber video...';
  box.scrollIntoView({behavior:'smooth',block:'center'});
  try{
    const j=await jget(`/movies/${slug}/play`);
    st.textContent='▶ '+(j.title||'');
    if(hlsInst){try{hlsInst.destroy()}catch(e){}hlsInst=null}
    if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=j.hls;v.play().catch(()=>{})}
    else if(window.Hls&&Hls.isSupported()){
      hlsInst=new Hls({maxBufferLength:30,maxMaxBufferLength:60});
      hlsInst.loadSource(j.hls);hlsInst.attachMedia(v);
      hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
      hlsInst.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)st.textContent='Sumber bermasalah — klik Putar lagi atau coba judul lain.'});
    }else st.textContent='Browser ini tidak mendukung pemutar HLS';
  }catch(e){
    st.textContent=e.message.indexOf('404')>=0
      ?'Judul/episode ini belum ada sumber playernya (biasanya rilis baru). Coba yang lain ya.'
      :'Gagal menyiapkan video ('+e.message+') — klik Putar sekali lagi.';
  }
}
function tagGoCountry(name){
  const map={'korea':'south-korea','south korea':'south-korea','amerika':'usa','amerika serikat':'usa','inggris':'uk','jepang':'japan','thailand':'thailand','cina':'china','tiongkok':'china'};
  const key=String(name).toLowerCase().trim();
  const slug=map[key]||key.replace(/ /g,'-');
  closeDetail();
  goCat('/movies/country/'+slug,'Negara — '+name,1);
}
function showToast(msg){
  const t=document.getElementById('detailToast');
  if(!t) return;
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove('show'),3200);
}
function reportCurrent(){
  const c=window.__curDetail; if(!c) return;
  let reps=[]; try{ reps=JSON.parse(localStorage.getItem('cz-reports')||'[]'); }catch(e){}
  reps.push({slug:c.slug, title:c.title, at:Date.now()});
  localStorage.setItem('cz-reports', JSON.stringify(reps));
  showToast('Laporan dicatat. Kalau video bermasalah, coba Ganti Player atau judul lain dulu ya.');
}
async function shareCurrent(){
  const c=window.__curDetail; if(!c) return;
  const url=location.origin+location.pathname+'#'+c.slug;
  try{
    if(navigator.share){ await navigator.share({title:'Zona Cinema — '+c.title, url}); }
    else { await navigator.clipboard.writeText(url); showToast('Link tersalin, tinggal tempel buat dibagikan.'); }
  }catch(e){ /* user membatalkan share */ }
}
function toggleSaveCurrent(){
  const c=window.__curDetail; if(!c) return;
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem('cz-saved')||'[]'); }catch(e){}
  const i=saved.findIndex(x=>x.slug===c.slug);
  const btn=document.getElementById('saveBtn');
  if(i>=0){ saved.splice(i,1); if(btn){btn.classList.remove('saved'); btn.innerHTML=ICO.bookmark+'<span>Save</span>';} showToast('Dihapus dari simpanan.'); }
  else { saved.push({slug:c.slug, title:c.title, year:c.year, savedAt:Date.now()}); if(btn){btn.classList.add('saved'); btn.innerHTML=ICO.check+'<span>Tersimpan</span>';} showToast('Tersimpan di perangkat ini (localStorage cz-saved).'); }
  localStorage.setItem('cz-saved', JSON.stringify(saved));
}
function rateCurrent(n){
  const c=window.__curDetail; if(!c) return;
  localStorage.setItem('cz-rate-'+c.slug, String(n));
  document.querySelectorAll('#ratebtns button').forEach((b,i)=>b.classList.toggle('on', i<n));
  showToast('Rating kamu '+n+'/10 tersimpan buat judul ini.');
}
function openTrailer(){
  const c=window.__curDetail; if(!c) return;
  window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(c.title+' '+c.year+' official trailer'), '_blank');
}
function goFullscreen(){
  const v=document.getElementById('vid'), box=document.getElementById('playerstage');
  const el=(v && v.style.display!=='none') ? v : box;
  if(!el) return;
  if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}
function closeDetail(){
  stopVideo();
  const mo=document.getElementById('modal');
  mo.classList.remove('on');document.body.classList.remove('noscroll');
  document.getElementById('sheet').innerHTML='';
}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

/* ================= SCROLL NAV ================= */
window.addEventListener('scroll',()=>{
  document.getElementById('nav').classList.toggle('solid',window.scrollY>40);
},{passive:true});

/* ================= INIT ================= */
document.getElementById('navlinks').innerHTML=NAV.map(n=>`<span data-n="${n.id}" onclick="go('${n.id}')">${n.label}</span>`).join('');
go('home');
/* ================= HERO ROTATION (safe: hidden tab / reduced-motion / modal) ================= */
function setHero(i){
  heroI=i; const m=heroList[heroI%heroList.length]; if(!m)return;
  const b=document.querySelector('.hero-bg img'), p=document.querySelector('.hero-poster img');
  if(b)b.src=img(m); if(p)p.src=img(m);
  const h1=document.querySelector('.hero-txt h1'); if(h1)h1.textContent=m.title||'';
  const sy=document.querySelector('.hero-syn'); if(sy)sy.textContent=m.synopsis||'Klik putar untuk mulai menonton.';
  document.querySelectorAll('#heroDots .hd').forEach((d,j)=>d.classList.toggle('on',j===i));
}
setInterval(()=>{
  if(!heroList.length||curState.kind!=='home')return;
  if(document.getElementById('modal').classList.contains('on'))return;
  if(document.hidden)return;
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  setHero((heroI+1)%heroList.length);
},9000);
</script>
