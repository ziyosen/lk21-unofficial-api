<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineZone — Nonton Film & Series Sub Indo</title>
<style>
:root{
  --bg:#f8fafc; --bg2:#ffffff; --card:#ffffff; --bord:#e2e8f0; --hov:#f1f5f9;
  --text:#1e293b; --mut:#64748b; --acc:#f97316; --acc2:#fb923c; --sh:0 1px 3px rgba(0,0,0,.08);
}
html.dark{
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --bord:#334155; --hov:#334155;
  --text:#f1f5f9; --mut:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;transition:background .3s,color .3s}
button{font-family:inherit}
/* NAVBAR */
nav{position:sticky;top:0;z-index:40;background:var(--bg2);border-bottom:1px solid var(--bord);transition:all .3s}
.nav-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center}
.logo{font-weight:900;font-size:20px;color:var(--acc);display:flex;align-items:center;gap:7px;white-space:nowrap}
.logo svg{width:22px;height:22px}
#q{flex:1;min-width:120px;background:var(--bg);border:1.5px solid var(--bord);border-radius:10px;padding:9px 14px;color:var(--text);font-size:14.5px;outline:none;transition:border .2s}
#q:focus{border-color:var(--acc)}
.tbtn{background:var(--bg);border:1.5px solid var(--bord);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px;display:grid;place-items:center;flex-shrink:0}
main{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
/* TABS */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{background:var(--card);border:1.5px solid var(--bord);color:var(--mut);border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:600;transition:all .2s}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* GRID & CARD */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
@media(max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--bord);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--sh)}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 12px 28px rgba(0,0,0,.18)}
.poster{position:relative;aspect-ratio:2/3;background:var(--hov);overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:200% 100%;animation:shm 1.4s infinite}
@keyframes shm{to{background-position:-200% 0}}
.badge{position:absolute;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);border-radius:7px;padding:2.5px 8px;font-size:11px}
.badge.rate{top:8px;left:8px;color:#fbbf24;font-weight:800}
.badge.qual{top:8px;right:8px;color:#4ade80;font-weight:700;font-size:10px;letter-spacing:.4px}
.info{padding:10px 11px 12px}
.info h3{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.meta{margin-top:5px;font-size:11.5px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* PAGER */
.pager{display:flex;gap:10px;justify-content:center;align-items:center;padding:24px 0 6px}
.pager button{background:var(--card);border:1.5px solid var(--bord);color:var(--text);border-radius:10px;padding:9px 20px;cursor:pointer;font-weight:600}
.pager button:disabled{opacity:.35;cursor:default}
.pager span{color:var(--mut);font-size:13.5px;font-weight:600}
/* DETAIL MODAL */
#detail{position:fixed;inset:0;background:rgba(2,6,23,.8);backdrop-filter:blur(6px);display:none;z-index:50;overflow-y:auto;padding:20px}
.sheet{max-width:880px;margin:20px auto;background:var(--bg2);border:1px solid var(--bord);border-radius:18px;overflow:hidden;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero{display:flex;gap:20px;padding:22px;flex-wrap:wrap}
.hero img{width:190px;border-radius:12px;flex-shrink:0;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hero h2{font-size:21px;margin-bottom:8px;line-height:1.3}
.sub{color:var(--mut);font-size:13px;margin-bottom:6px}
.syn{margin-top:12px;font-size:13.5px;line-height:1.65;color:var(--text);opacity:.85}
.tag{display:inline-block;background:var(--hov);border:1px solid var(--bord);border-radius:7px;padding:3px 10px;font-size:11.5px;margin:3px 5px 0 0;font-weight:600}
.close{position:fixed;top:14px;right:14px;background:var(--acc);color:#fff;border:none;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.putar{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:none;border-radius:10px;padding:12px 30px;font-weight:800;cursor:pointer;font-size:15px;margin-bottom:12px;box-shadow:0 6px 18px rgba(249,115,22,.4);display:inline-flex;align-items:center;gap:8px}
.putar:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(249,115,22,.5)}
#vid{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;margin-top:14px}
.empty{text-align:center;color:var(--mut);padding:60px 20px;font-size:14.5px}
.spin{margin:60px auto;width:34px;height:34px;border:3px solid var(--bord);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px;border-top:1px solid var(--bord);margin-top:20px}
</style>
</head>
<body>
<nav><div class="nav-in">
  <div class="logo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm3 2v2h2V5H7zm8 0v2h2V5h-2zM7 19v2h2v-2H7zm8 0v2h2v-2h-2zM10 9.5v5l4.5-2.5L10 9.5z"/></svg>Cine<span style="color:var(--text)">Zone</span></div>
  <input id="q" placeholder="Cari film atau series..." autocomplete="off">
  <button class="tbtn" id="themeBtn" title="Ganti tema">🌙</button>
</div></nav>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
  <div class="pager" id="pager" style="display:none">
    <button id="prev">‹ Sebelumnya</button><span id="pginfo"></span><button id="next">Berikutnya ›</button>
  </div>
</main>
<div id="detail"><button class="close" onclick="closeDetail()">✕</button><div class="sheet" id="sheet"></div></div>
<footer>By: ZeinthHub Project · Powered by LK21 Unofficial API</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
const API = window.CINE_API || (location.origin.includes('vercel') ? location.origin : 'http://localhost:8000');
const TABS = [
  {id:'latest',  label:'🔥 Terbaru',        url:p=>`/movies/latest?page=${p}`},
  {id:'series',  label:'📺 Series',         url:p=>`/series/genre/drama?page=${p}`},
  {id:'genre',   label:'🎭 Genre',          url:p=>`/movies/genre/action?page=${p}`},
  {id:'year',    label:'📅 2026',           url:p=>`/movies/year/2026?page=${p}`},
  {id:'country', label:'🌍 Barat',          url:p=>`/movies/country/usa?page=${p}`},
];
let tab='latest', page=1, searchMode=false;

/* tema */
const tbtn=document.getElementById('themeBtn');
function applyTheme(t){document.documentElement.classList.toggle('dark',t==='dark');tbtn.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('cz-theme',t)}
applyTheme(localStorage.getItem('cz-theme')|| (matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
tbtn.onclick=()=>applyTheme(document.documentElement.classList.contains('dark')?'light':'dark');

function esc(s){return String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
const PLACE='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22225%22%3E%3Crect width=%22100%25%22 height=%22100%25%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%2394a3b8%22 text-anchor=%22middle%22 font-size=%2242%22%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E';

async function jget(u){const r=await fetch(API+u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

function cards(items){
  return items.map(m=>`
  <div class="card" onclick="openDetail('${esc(m.slug)}')">
    <div class="poster">
      <div class="shimmer" id="sh-${esc(m.slug).replace(/[^a-z0-9]/gi,'')}"></div>
      <img loading="lazy" src="${esc(m.images||PLACE)}" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.onerror=null;this.src='${PLACE}';this.previousElementSibling&&this.previousElementSibling.remove()">
      ${m.rating&&m.rating!=='N/A'&&m.rating!=='0'?`<span class="badge rate">★ ${esc(m.rating)}</span>`:''}
      ${m.quality&&m.quality!=='N/A'?`<span class="badge qual">${esc(m.quality)}</span>`:''}
    </div>
    <div class="info"><h3>${esc(m.title)}</h3>
    <div class="meta">${[m.year,m.genre].filter(x=>x&&x!=='N/A').map(esc).join(' · ')}</div></div>
  </div>`).join('');
}

async function load(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="spin"></div>';
  document.getElementById('pager').style.display='none';
  try{
    const url = searchMode? `/search?s=${encodeURIComponent(tab)}&page=${page}` : TABS.find(t=>t.id===tab).url(page);
    const d = await jget(url);
    const r = d.results||[];
    c.innerHTML = r.length? `<div class="grid">${cards(r)}</div>` : `<div class="empty">${searchMode?`Tidak ada hasil untuk "${esc(tab)}" 😕`:'Belum ada data 🙏'}</div>`;
    const tp=d.total_pages||1;
    if(tp>1){document.getElementById('pager').style.display='flex';document.getElementById('pginfo').textContent=`Halaman ${page} / ${tp}`;}
    document.getElementById('prev').disabled=page<=1;
    document.getElementById('next').disabled=page>=tp;
  }catch(e){
    c.innerHTML=`<div class="empty">Gagal memuat: ${esc(e.message)}<br><small>Coba lagi sebentar</small></div>`;
  }
}
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(t=>
    `<button class="${t.id===tab&&!searchMode?'on':''}" onclick="pick('${t.id}')">${t.label}</button>`).join('');
}
function pick(id){tab=id;searchMode=false;page=1;document.getElementById('q').value='';renderTabs();load();window.scrollTo(0,0)}
let sT;document.getElementById('q').addEventListener('input',e=>{
  clearTimeout(sT);
  sT=setTimeout(()=>{const v=e.target.value.trim();
    if(v){tab=v;searchMode=true;page=1}else{searchMode=false;tab='latest';page=1}
    renderTabs();load();},550);
});
document.getElementById('prev').onclick=()=>{if(page>1){page--;load();window.scrollTo(0,0)}};
document.getElementById('next').onclick=()=>{page++;load();window.scrollTo(0,0)};

/* DETAIL + PLAYER */
let hlsInst=null;
function stopVideo(){
  if(hlsInst){hlsInst.destroy();hlsInst=null}
  const v=document.getElementById('vid');
  if(v){v.pause();v.removeAttribute('src');v.load()}
}
async function playMovie(slug){
  const box=document.getElementById('playerbox'),st=document.getElementById('vstatus');
  box.style.display='block';st.textContent='⏳ Menyiapkan sumber video...';
  stopVideo();box.scrollIntoView({behavior:'smooth'});
  try{
    const j=await jget(`/movies/${slug}/play`);
    const v=document.getElementById('vid');
    st.textContent='🎬 '+(j.title||'');
    if(hlsInst){hlsInst.destroy();hlsInst=null}
    if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=j.hls;v.play().catch(()=>{})}
    else if(window.Hls&&Hls.isSupported()){
      hlsInst=new Hls({maxBufferLength:30});
      hlsInst.loadSource(j.hls);hlsInst.attachMedia(v);
      hlsInst.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
      hlsInst.on(Hls.Events.ERROR,(_,d2)=>{if(d2.fatal)st.textContent='⚠️ Sumber bermasalah — klik PUTAR lagi atau coba judul lain.'});
    }else st.textContent='Browser tidak mendukung HLS 😕';
  }catch(e){
    st.textContent=e.message.indexOf('404')>=0
      ?'😔 Judul ini belum ada sumber playernya (biasanya film baru). Coba judul lain ya.'
      :'⚠️ Gagal menyiapkan video — klik PUTAR sekali lagi.';
  }
}
async function openDetail(slug){
  const d=document.getElementById('detail'),s=document.getElementById('sheet');
  d.style.display='block';s.innerHTML='<div class="spin"></div>';
  try{
    const j=await jget(`/movies/${slug}/stream`);
    const m=j.result||{};
    s.innerHTML=`
    <div class="hero">
      <img src="${esc(m.image||PLACE)}" onerror="this.src='${PLACE}'">
      <div style="flex:1;min-width:230px">
        <button class="putar" onclick="playMovie('${esc(m.slug)}')">▶️ PUTAR</button>
        <h2>${esc(m.title)} ${m.year&&m.year!=='N/A'?`<small style="color:var(--mut);font-weight:500">(${esc(m.year)})</small>`:''}</h2>
        <div class="sub">${[m.rating&&m.rating!=='N/A'?'★ '+m.rating:'',m.quality,m.duration,m.country,m.release].filter(x=>x&&x!=='N/A').map(esc).join(' · ')}</div>
        <div>${(Array.isArray(m.genres)?m.genres:String(m.genres||'').split(',')).filter(g=>g&&g.trim()&&g.trim()!=='N/A').map(g=>`<span class="tag">${esc(g.trim())}</span>`).join('')}</div>
        ${m.directors&&m.directors.length?`<div class="sub" style="margin-top:10px">🎬 ${m.directors.map(esc).join(', ')}</div>`:''}
        ${m.stars&&m.stars.length?`<div class="sub">🌟 ${m.stars.map(esc).join(', ')}</div>`:''}
        <div class="syn">${esc(m.synopsis)}</div>
        <div id="playerbox" style="display:none">
          <video id="vid" controls autoplay playsinline></video>
          <div id="vstatus" class="sub" style="margin-top:8px"></div>
        </div>
      </div>
    </div>`;
  }catch(e){s.innerHTML=`<div class="empty">Gagal memuat detail: ${esc(e.message)}</div>`}
}
function closeDetail(){document.getElementById('detail').style.display='none';stopVideo()}
document.getElementById('detail').addEventListener('click',e=>{if(e.target.id==='detail')closeDetail()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});
renderTabs();load();
</script>
</body>
</html>
