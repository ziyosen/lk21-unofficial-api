[build]
  command = "npm install"
  functions = "functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/movies/*"
  to = "/.netlify/functions/api/movies/:splat"
  status = 200

[[redirects]]
  from = "/series/*"
  to = "/.netlify/functions/api/series/:splat"
  status = 200

[[redirects]]
  from = "/search"
  to = "/.netlify/functions/api/search"
  status = 200

[[redirects]]
  from = "/hls"
  to = "/.netlify/functions/api/hls"
  status = 200
